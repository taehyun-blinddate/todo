<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>할 일</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-sub: #fafbfc;
    --border: #e6e8ec;
    --text: #1c1f23;
    --text-muted: #8a9099;
    --accent: #3b82f6;
    --accent-strong: #2f6fe0;
    --accent-weak: #eff6ff;
    --danger: #ef4444;
    --danger-weak: #fef2f2;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 28px rgba(16, 24, 40, .07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── 헤더 ── */
  .app__header { padding: 28px 24px 18px; }
  .app__title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .app__count {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ── 입력 폼 ── */
  .composer { display: flex; gap: 8px; padding: 0 24px 16px; }
  .composer__input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: inherit;
    font: inherit;
  }
  .composer__input::placeholder { color: var(--text-muted); }
  .composer__input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .composer__submit {
    flex: none;
    padding: 11px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .composer__submit:hover { background: var(--accent-strong); }

  /* ── 필터 ── */
  .filters { display: flex; gap: 6px; padding: 0 24px 14px; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .filter:hover { background: var(--bg); }
  .filter[aria-pressed="true"] {
    background: var(--accent-weak);
    color: var(--accent);
    font-weight: 600;
  }
  .filter__count { font-variant-numeric: tabular-nums; opacity: .75; }

  /* ── 목록 ── */
  .board { border-top: 1px solid var(--border); }
  .list { list-style: none; margin: 0; padding: 0; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: 0; }

  .item__check {
    flex: none;
    width: 18px;
    height: 18px;
    margin: 3px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .item__text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: text;
  }
  .item--done .item__text {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .item__actions {
    flex: none;
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .item:hover .item__actions,
  .item:focus-within .item__actions { opacity: 1; }
  @media (hover: none) { .item__actions { opacity: 1; } }

  .item__action {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .item__action:hover { background: var(--bg); color: var(--text); }
  .item__action[data-action="delete"]:hover { background: var(--danger-weak); color: var(--danger); }

  /* ── 인라인 편집 ── */
  .item--editing { padding-top: 8px; padding-bottom: 8px; }
  .item__input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--accent);
    border-radius: 9px;
    box-shadow: 0 0 0 3px var(--accent-weak);
    background: var(--surface);
    color: inherit;
    font: inherit;
  }
  .item__input:focus { outline: none; }

  /* ── 빈 상태 ── */
  .empty {
    margin: 0;
    padding: 44px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── 푸터 ── */
  .app__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface-sub);
  }
  .app__hint { color: var(--text-muted); font-size: 12px; }
  .clear {
    flex: none;
    margin-left: auto;   /* 힌트가 숨겨지는 좁은 화면에서도 오른쪽 정렬 유지 */
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-muted);
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .clear:hover:not(:disabled) {
    border-color: #fecaca;
    background: var(--danger-weak);
    color: var(--danger);
  }
  .clear:disabled { opacity: .45; cursor: default; }

  /* ── 좁은 화면 ── */
  @media (max-width: 420px) {
    body { padding: 20px 12px; }
    .app__header, .composer, .filters, .item, .empty, .app__footer {
      padding-left: 16px;
      padding-right: 16px;
    }
    .app__hint { display: none; }
  }
</style>
</head>
<body>

<main class="app">
  <header class="app__header">
    <h1 class="app__title">할 일</h1>
    <p class="app__count" id="remaining" aria-live="polite"></p>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <input class="composer__input" id="new-todo" type="text" maxlength="200"
           placeholder="무엇을 해야 하나요?" aria-label="새로운 할 일" autofocus>
    <button class="composer__submit" type="submit">추가</button>
  </form>

  <div class="filters" id="filters" role="group" aria-label="할 일 필터">
    <button class="filter" type="button" data-filter="all" aria-pressed="true">
      전체 <span class="filter__count" data-count="all">0</span>
    </button>
    <button class="filter" type="button" data-filter="active" aria-pressed="false">
      진행중 <span class="filter__count" data-count="active">0</span>
    </button>
    <button class="filter" type="button" data-filter="completed" aria-pressed="false">
      완료 <span class="filter__count" data-count="completed">0</span>
    </button>
  </div>

  <div class="board">
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
  </div>

  <footer class="app__footer">
    <span class="app__hint">할 일을 더블클릭하면 바로 수정할 수 있어요</span>
    <button class="clear" id="clear-completed" type="button" disabled>완료 항목 삭제</button>
  </footer>
</main>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'wooyeon.todo.v1';
  const MAX_LENGTH = 200;

  const EMPTY_MESSAGE = {
    all: '아직 할 일이 없어요. 위 입력창에 추가해 보세요.',
    active: '진행중인 할 일이 없어요. 모두 끝냈네요!',
    completed: '완료한 할 일이 아직 없어요.',
  };

  const el = {
    composer: document.getElementById('composer'),
    input: document.getElementById('new-todo'),
    filters: document.getElementById('filters'),
    list: document.getElementById('list'),
    empty: document.getElementById('empty'),
    remaining: document.getElementById('remaining'),
    clear: document.getElementById('clear-completed'),
  };

  let todos = loadTodos();
  let filter = 'all';   // 'all' | 'active' | 'completed'
  let editingId = null;

  /* ───────── 저장소 ───────── */

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter((t) => t && typeof t.text === 'string' && t.text.trim())
        .map((t) => ({
          id: typeof t.id === 'string' && t.id ? t.id : createId(),
          text: t.text.slice(0, MAX_LENGTH),
          done: t.done === true,
          createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now(),
        }));
    } catch (err) {
      console.warn('저장된 할 일을 불러오지 못했습니다.', err);
      return [];
    }
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (err) {
      console.warn('할 일을 저장하지 못했습니다.', err);
    }
  }

  function createId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /* ───────── 상태 변경 ───────── */

  function findTodo(id) {
    return todos.find((t) => t.id === id) || null;
  }

  function addTodo(text) {
    todos.push({ id: createId(), text, done: false, createdAt: Date.now() });
    saveTodos();
  }

  function toggleTodo(id) {
    const todo = findTodo(id);
    if (!todo) return;
    todo.done = !todo.done;
    saveTodos();
  }

  function removeTodo(id) {
    const index = todos.findIndex((t) => t.id === id);
    if (index === -1) return;
    todos.splice(index, 1);
    saveTodos();
  }

  function updateTodo(id, text) {
    const todo = findTodo(id);
    if (!todo || todo.text === text) return;
    todo.text = text;
    saveTodos();
  }

  function clearCompleted() {
    todos = todos.filter((t) => !t.done);
    saveTodos();
  }

  /* ───────── 렌더링 ───────── */

  function getVisibleTodos() {
    if (filter === 'active') return todos.filter((t) => !t.done);
    if (filter === 'completed') return todos.filter((t) => t.done);
    return todos;
  }

  // 사용자 입력은 항상 textContent / setAttribute 로만 넣는다 (innerHTML 금지).
  function createItemEl(todo) {
    const li = document.createElement('li');
    li.className = 'item' + (todo.done ? ' item--done' : '');
    li.dataset.id = todo.id;

    if (todo.id === editingId) {
      li.classList.add('item--editing');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'item__input';
      input.maxLength = MAX_LENGTH;
      input.value = todo.text;
      input.setAttribute('aria-label', '할 일 수정');
      li.appendChild(input);
      return li;
    }

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'item__check';
    check.checked = todo.done;
    check.setAttribute('aria-label', (todo.done ? '완료 해제: ' : '완료 표시: ') + todo.text);

    const text = document.createElement('span');
    text.className = 'item__text';
    text.textContent = todo.text;
    text.title = '더블클릭하여 수정';

    const actions = document.createElement('div');
    actions.className = 'item__actions';
    actions.append(
      createActionEl('edit', '✎', todo.text + ' 수정'),
      createActionEl('delete', '✕', todo.text + ' 삭제'),
    );

    li.append(check, text, actions);
    return li;
  }

  function createActionEl(action, glyph, label) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'item__action';
    button.dataset.action = action;
    button.textContent = glyph;
    button.setAttribute('aria-label', label);
    return button;
  }

  function render() {
    const visible = getVisibleTodos();

    const fragment = document.createDocumentFragment();
    visible.forEach((todo) => fragment.appendChild(createItemEl(todo)));
    el.list.replaceChildren(fragment);

    el.empty.hidden = visible.length > 0;
    if (visible.length === 0) el.empty.textContent = EMPTY_MESSAGE[filter];

    const active = todos.filter((t) => !t.done).length;
    const completed = todos.length - active;

    el.remaining.textContent = todos.length === 0
      ? '할 일을 추가해 보세요'
      : `남은 할 일 ${active}개`;

    setCount('all', todos.length);
    setCount('active', active);
    setCount('completed', completed);

    el.filters.querySelectorAll('.filter').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.filter === filter));
    });

    el.clear.disabled = completed === 0;

    if (editingId) {
      const input = el.list.querySelector('.item__input');
      if (input) {
        input.focus();
        input.select();
      }
    }
  }

  function setCount(name, value) {
    const node = el.filters.querySelector(`[data-count="${name}"]`);
    if (node) node.textContent = String(value);
  }

  /* ───────── 인라인 편집 ───────── */

  function startEdit(id) {
    if (!findTodo(id)) return;
    editingId = id;
    render();
  }

  // 편집 중인 항목만 교체한다. 목록 전체를 다시 그리면 다른 항목의 버튼이
  // 클릭 도중(mousedown -> mouseup 사이) 사라져 클릭이 사라진다.
  function exitEdit(input, commit, refocus) {
    const id = editingId;
    editingId = null;

    if (commit) {
      const value = input.value.trim();
      if (value) updateTodo(id, value);   // 빈 값이면 저장하지 않고 원본 유지
    }

    const li = input.closest('.item');
    const todo = findTodo(id);
    if (!li || !todo) {
      render();
      return;
    }

    const next = createItemEl(todo);
    li.replaceWith(next);
    if (refocus) {
      const button = next.querySelector('[data-action="edit"]');
      if (button) button.focus();
    }
  }

  /* ───────── 이벤트 ───────── */

  el.composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = el.input.value.trim();
    el.input.value = '';
    el.input.focus();
    if (!text) return;

    addTodo(text);
    if (filter === 'completed') filter = 'all';   // 새 항목이 보이지 않는 필터면 전체로
    render();
  });

  el.filters.addEventListener('click', (e) => {
    const button = e.target.closest('.filter');
    if (!button || button.dataset.filter === filter) return;
    filter = button.dataset.filter;
    editingId = null;
    render();
  });

  el.list.addEventListener('click', (e) => {
    const li = e.target.closest('.item');
    if (!li) return;
    const id = li.dataset.id;

    if (e.target.classList.contains('item__check')) {
      toggleTodo(id);
      render();
      return;
    }

    const action = e.target.closest('.item__action');
    if (!action) return;
    if (action.dataset.action === 'delete') {
      removeTodo(id);
      render();
    } else {
      startEdit(id);
    }
  });

  el.list.addEventListener('dblclick', (e) => {
    const text = e.target.closest('.item__text');
    if (!text) return;
    startEdit(text.closest('.item').dataset.id);
  });

  el.list.addEventListener('keydown', (e) => {
    if (!e.target.classList.contains('item__input')) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      exitEdit(e.target, true, true);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      exitEdit(e.target, false, true);
    }
  });

  // 편집 중 다른 곳을 클릭하면 저장. Enter/Escape 로 이미 빠져나왔다면 editingId 가
  // null 이므로 중복 처리되지 않는다.
  el.list.addEventListener('focusout', (e) => {
    if (!e.target.classList.contains('item__input') || editingId === null) return;
    exitEdit(e.target, true, false);
  });

  el.clear.addEventListener('click', () => {
    if (!todos.some((t) => t.done)) return;
    clearCompleted();
    editingId = null;
    render();
  });

  // 같은 앱을 여러 탭에서 열었을 때 서로 덮어쓰지 않도록 동기화
  window.addEventListener('storage', (e) => {
    if (e.key !== STORAGE_KEY) return;
    todos = loadTodos();
    editingId = null;
    render();
  });

  render();
})();
</script>

</body>
</html>
